name: xnu

# 无 Mac 内核构建：在 GitHub 的 macOS runner 上编译 polaris 的 XNU。
#
# 用法：
#   1. 改 xnu-override.patch（我们的内核改动，diff 作用于上游的 xnu/patches/ 目录）
#   2. commit 后自动触发（或 Actions 页面手动 Run workflow）
#   3. 下载 artifact: xnu-kernel
on:
  workflow_dispatch:
  push:
    paths:
      - "xnu-override.patch"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM: luuu20309/ios16_on_polaris_mix2s
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549

jobs:
  build:
    # macOS 14 自带 Xcode 15.x，其 iig 与 xnu-8796 的 IORPC ABI 匹配
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream patch set
        run: |
          curl -fsSL -o upstream.tgz "https://codeload.github.com/${UPSTREAM}/tar.gz/refs/heads/main"
          tar xzf upstream.tgz
          mv ios16_on_polaris_mix2s-* upstream
          ls upstream/xnu/patches | head

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp upstream/xnu/patches/*.patch upstream/xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel 只编 arm64e；SWEET 内核是纯 arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh

      - name: Apply our kernel overrides
        run: |
          if [ -s xnu-override.patch ]; then
            echo "== applying xnu-override.patch =="
            ( cd dxb/patches && patch -p1 --batch --forward < ../../xnu-override.patch )
          else
            echo "no override patch (building stock upstream set)"
          fi

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: "-k"
        run: bash build.sh

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS 2>/dev/null) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
          retention-days: 7
