name: xnu

# 鏃?Mac 鍐呮牳鏋勫缓锛氬湪 GitHub 鐨?macOS runner 涓婄紪璇?polaris 鐨?XNU銆?#
# 鐢ㄦ硶锛?#   1. 鏀?xnu-override.patch锛堟垜浠殑鍐呮牳鏀瑰姩锛宒iff 浣滅敤浜庝笂娓哥殑 xnu/patches/ 鐩綍锛?#   2. commit 鍚庤嚜鍔ㄨЕ鍙戯紙鎴?Actions 椤甸潰鎵嬪姩 Run workflow锛?#   3. 涓嬭浇 artifact: xnu-kernel
on:
  workflow_dispatch:
  push:
    paths:
      - "xnu-override.patch"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOS_VERSION: "13.5"
  KERNEL_CONFIG: RELEASE
  MACHINE_CONFIG: SWEET
  UPSTREAM: luuu20309/ios16_on_polaris_mix2s
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549

jobs:
  build:
    # macOS 14 鑷甫 Xcode 15.x锛屽叾 iig 涓?xnu-8796 鐨?IORPC ABI 鍖归厤
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream patch set
        run: |
          curl -fsSL -o upstream.tgz "https://codeload.github.com/${UPSTREAM}/tar.gz/refs/heads/main"
          tar xzf upstream.tgz
          mv ios16_on_polaris_mix2s-* upstream
          ls upstream/xnu/patches | head

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp upstream/xnu/patches/*.patch upstream/xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel 鍙紪 arm64e锛汼WEET 鍐呮牳鏄函 arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh

      - name: Add extra kernel patches
        run: |
          if compgen -G "patches-extra/*.patch" > /dev/null; then
            cp patches-extra/*.patch dxb/patches/
            echo "extra patches:"; ls dxb/patches | tail -5
          else
            echo "no extra patches"
          fi
      - name: Apply our kernel overrides
        run: |
          if [ -s xnu-override.patch ]; then
            echo "== applying xnu-override.patch =="
            ( cd dxb/patches && patch -p1 --batch --forward < ../../xnu-override.patch )
          else
            echo "no override patch (building stock upstream set)"
          fi

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: "-k"
        run: bash build.sh

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS 2>/dev/null) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-release
          path: out/
          if-no-files-found: warn
          retention-days: 7



